        case 'Cool & Marine': {
          const marine = [
            { h: 222, s: 75, l: 18, name: 'Midnight Abyss', usage: 'Deep Nautical Anchor' },
            { h: 210, s: 85, l: 48, name: 'Marine Cobalt', usage: 'Primary Ocean CTA' },
            { h: 188, s: 90, l: 46, name: 'Vivid Cyan Wave', usage: 'Interactive Surface Highlight' },
            { h: 168, s: 70, l: 52, name: 'Seafoam Reef', usage: 'Positive Affirmation' },
            { h: 198, s: 40, l: 92, name: 'Arctic Ice Mist', usage: 'Cool Tinted Canvas' },
            { h: 235, s: 60, l: 30, name: 'Deep Sea Trench', usage: 'Secondary Dark Shade' },
            { h: 178, s: 65, l: 75, name: 'Glacial Lagoon', usage: 'Soft Water Tint' }
          ];
          for (let i = 0; i < remainingSlots; i++) {
            const m = marine[i % marine.length];
            hslPalette.push({ h: m.h, s: m.s, l: m.l, name: m.name, usage: m.usage });
          }
          break;
        }
        case 'Soft Pastel': {
          const shifts = [30, 60, 120, 180, 240, 300, 330];
          for (let i = 0; i < remainingSlots; i++) {
            const hue = (primaryHsl.h + shifts[i % shifts.length]) % 360;
            const s = 45 + ((i * 7) % 25);
            const l = 78 + ((i * 5) % 15);
            hslPalette.push({ h: hue, s, l, name: getColorName(hue, s, l), usage: i === 0 ? 'Pastel Highlight Card' : 'Soft Tint Element' });
          }
          break;
        }
        case 'Clean Minimalist': {
          const baseHue = primaryHsl.h;
          const neutrals = [
            { h: baseHue, s: 18, l: 14, name: 'Obsidian Slate', usage: 'Dark Mode Ground' },
            { h: baseHue, s: 12, l: 26, name: 'Graphite Charcoal', usage: 'Header & Primary Text' },
            { h: baseHue, s: 10, l: 48, name: 'Neutral Mid Slate', usage: 'Subheadings & Icons' },
            { h: baseHue, s: 14, l: 82, name: 'Platinum Frost', usage: 'Divider & Border Tint' },
            { h: baseHue, s: 20, l: 95, name: 'Chalk Canvas', usage: 'Light Mode Surface' },
            { h: (baseHue + 180) % 360, s: 85, l: 52, name: 'Focal Pop Accent', usage: 'Single Focal Pop' },
            { h: baseHue, s: 8, l: 65, name: 'Silver Mist', usage: 'Muted Supporting Label' }
          ];
          for (let i = 0; i < remainingSlots; i++) {
            const n = neutrals[i % neutrals.length];
            hslPalette.push({ h: n.h, s: n.s, l: n.l, name: n.name, usage: n.usage });
          }
          break;
        }
        default: {
          const vibrantAngles = [
            { angle: 35, s: 95, l: 52, usage: 'High-Energy Secondary CTA' },
            { angle: 180, s: 90, l: 50, usage: 'Punchy Complementary Flash' },
            { angle: 135, s: 85, l: 48, usage: 'Dynamic Accent Tag' },
            { angle: 280, s: 90, l: 54, usage: 'Electric Violet Highlight' },
            { angle: 0, s: 15, l: 12, usage: 'Deep Black Carbon Anchor' },
            { angle: 215, s: 95, l: 58, usage: 'Radiant Marine Indicator' },
            { angle: 0, s: 25, l: 96, usage: 'Ultra-Clean Canvas' }
          ];
          for (let i = 0; i < remainingSlots; i++) {
            const v = vibrantAngles[i % vibrantAngles.length];
            const hue = (primaryHsl.h + v.angle) % 360;
            hslPalette.push({ h: hue, s: v.s, l: v.l, name: getColorName(hue, v.s, v.l), usage: v.usage });
          }
          break;
        }
      }

      const finalColors = [];
      for (let i = 0; i < safeCount; i++) {
        const lockedMatch = lockedColors[i] && lockedColors[i].isLocked ? lockedColors[i] : null;
        if (lockedMatch) {
          finalColors.push(lockedMatch);
        } else {
          const item = hslPalette[i] || hslPalette[0];
          const rawHex = hslToHex(item.h, item.s, item.l);
          const hex = strictWebSafe ? getNearestWebSafe(rawHex) : rawHex;
          finalColors.push(buildColorData(hex, item.name, item.usage, false, strictWebSafe));
        }
      }

      return {
        paletteName: `${style} Harmony`,
        description: `A uniquely calibrated ${safeCount}-color palette generated from ${validSeeds.length || 1} starting ${validSeeds.length === 1 ? 'color' : 'colors'} strictly adhering to ${style} theory principles.`,
        colors: finalColors,
        harmonyType: style
      };
    };

    /* ==========================================================================
       IMAGE UPLOAD & PIXEL QUANTIZATION ENGINE
       ========================================================================== */
    const getRgbDistance = (a, b) => {
      const dr = a.r - b.r;
      const dg = a.g - b.g;
      const db = a.b - b.b;
      return Math.sqrt(2 * dr * dr + 4 * dg * dg + 3 * db * db);
    };

    const getSaturationRgb = (r, g, b) => {
      const max = Math.max(r, g, b) / 255;
      const min = Math.min(r, g, b) / 255;
      if (max === min) return 0;
      const l = (max + min) / 2;
      const d = max - min;
      return l > 0.5 ? d / (2 - max - min) : d / (max + min);
    };

    const extractColorsFromImageFile = (file, maxColors = 10) => new Promise((resolve, reject) => {
      if (!file.type.startsWith('image/')) {
        reject(new Error('Please upload a valid image file (PNG, JPG, WebP, GIF, or SVG).'));
        return;
      }
      if (file.size > 15 * 1024 * 1024) {
        reject(new Error('Image file must be under 15 MB.'));
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const img = new Image();
        img.onload = () => {
          const maxDim = 180;
          const natW = img.naturalWidth || img.width || 160;
          const natH = img.naturalHeight || img.height || 160;
          const scale = Math.min(1, maxDim / Math.max(natW, natH));
          const width = Math.max(1, Math.round(natW * scale));
          const height = Math.max(1, Math.round(natH * scale));
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          if (!ctx) {
            reject(new Error('Canvas 2D context unavailable.'));
            return;
          }
          ctx.clearRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          const data = ctx.getImageData(0, 0, width, height).data;
          const buckets = new Map();
          const step = 14;
          let opaque = 0;

          for (let i = 0; i < data.length; i += 4) {
            if (data[i + 3] < 128) continue;
            const r = data[i], g = data[i + 1], b = data[i + 2];
            opaque++;
            const key = `${Math.round(r / step) * step},${Math.round(g / step) * step},${Math.round(b / step) * step}`;
            const sat = getSaturationRgb(r, g, b);
            const cur = buckets.get(key);
            if (cur) {
              cur.rSum += r; cur.gSum += g; cur.bSum += b; cur.count += 1; cur.satSum += sat;
            } else {
              buckets.set(key, { rSum: r, gSum: g, bSum: b, count: 1, satSum: sat });
            }
          }

          if (opaque === 0 || buckets.size === 0) {
            reject(new Error('No opaque pixels detected in this image.'));
            return;
          }

          const candidates = Array.from(buckets.values()).map(bkt => {
            const r = Math.round(bkt.rSum / bkt.count);
            const g = Math.round(bkt.gSum / bkt.count);
            const b = Math.round(bkt.bSum / bkt.count);
            const avgSat = bkt.satSum / bkt.count;
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            const isNearWhite = brightness > 246 && avgSat < 0.12;
            const isNearBlack = brightness < 12 && avgSat < 0.15;
            const score = bkt.count * (1 + avgSat * 2.8) * (isNearWhite ? 0.12 : isNearBlack ? 0.35 : 1);
            return { r, g, b, score, hex: rgbToHex(r, g, b) };
          }).sort((a, b) => b.score - a.score);

          const selected = [];
          for (const minDist of [85, 58, 36, 18]) {
            for (const cand of candidates) {
              if (selected.length >= maxColors) break;
              if (!selected.some(s => getRgbDistance(s, cand) < minDist)) {
                selected.push({ r: cand.r, g: cand.g, b: cand.b, hex: cand.hex });
              }
            }
            if (selected.length >= maxColors) break;
          }
          if (selected.length === 0 && candidates.length > 0) {
            selected.push(candidates[0]);
          }
          resolve({ previewUrl: dataUrl, fileName: file.name, colors: selected.map(c => c.hex) });
        };
        img.onerror = () => reject(new Error('Could not decode image format.'));
        img.src = dataUrl;
      };
      reader.onerror = () => reject(new Error('Failed to read image file.'));
      reader.readAsDataURL(file);
    });

    const sampleColorFromImageClick = (imgElement, clientX, clientY) => {
      const rect = imgElement.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return null;
      const relX = (clientX - rect.left) / rect.width;
      const relY = (clientY - rect.top) / rect.height;
      if (relX < 0 || relX > 1 || relY < 0 || relY > 1) return null;
      const natW = imgElement.naturalWidth || imgElement.width;
      const natH = imgElement.naturalHeight || imgElement.height;
      if (!natW || !natH) return null;
      const px = Math.min(natW - 1, Math.max(0, Math.floor(relX * natW)));
      const py = Math.min(natH - 1, Math.max(0, Math.floor(relY * natH)));
      const canvas = document.createElement('canvas');
      canvas.width = natW;
      canvas.height = natH;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      if (!ctx) return null;
      ctx.drawImage(imgElement, 0, 0, natW, natH);
      const pixel = ctx.getImageData(px, py, 1, 1).data;
      if (pixel[3] < 20) return null;
      return rgbToHex(pixel[0], pixel[1], pixel[2]);
    };

    const generatePaletteFromImageResult = (imageResult, count, style, strictWebSafe, lockedColors = []) => {
      const safeCount = Math.min(10, Math.max(2, count));
      const directColors = imageResult.colors.slice(0, safeCount).map((rawHex, idx) => {
        const hexToUse = strictWebSafe ? getNearestWebSafe(rawHex) : rawHex;
        const { h: hue, s, l } = hexToHsl(hexToUse);
        return buildColorData(hexToUse, getColorName(hue, s, l), getColorRole(idx, safeCount, l, s), false, strictWebSafe);
      });

      if (directColors.length < safeCount) {
        const harmonicFill = generateHarmonicPalette(safeCount, style, imageResult.colors.slice(0, 6), strictWebSafe, directColors);
        const existingSet = new Set(directColors.map(c => c.hex.toUpperCase()));
        for (const cand of harmonicFill.colors) {
          if (directColors.length >= safeCount) break;
          if (!existingSet.has(cand.hex.toUpperCase())) {
            directColors.push({ ...cand, isLocked: false });
            existingSet.add(cand.hex.toUpperCase());
          }
        }
      }

      const finalColors = directColors.slice(0, safeCount).map((c, idx) =>
        lockedColors[idx] && lockedColors[idx].isLocked ? lockedColors[idx] : c
      );

      return {
        paletteName: imageResult.fileName ? `Palette from ${imageResult.fileName.replace(/\.[^/.]+$/, '')}` : 'Image-Extracted Palette',
        description: `Extracted ${imageResult.colors.length} dominant color${imageResult.colors.length === 1 ? '' : 's'} from your uploaded image with WCAG & 216 web-safe fidelity.`,
        colors: finalColors,
        harmonyType: style
      };
    };

      const activeHsl = useMemo(() => hexToHsl(activeColor.hex), [activeColor.hex]);

                      const ratio = getContrastRatio(colorA.hex, colorB.hex);

                      const isSelected = (safeFgIndex === indexA && safeBgIndex === indexB) || (safeFgIndex === indexB && safeBgIndex === indexA);

    /* ==========================================================================
       EXPORT MODAL COMPONENT (CSS, TAILWIND, JSON, SVG, STANDALONE HTML)
       ========================================================================== */
    function ExportModal({ isOpen, onClose, paletteName, colors }) {
      const [tab, setTab] = useState('css');
      const [copied, setCopied] = useState(false);
      if (!isOpen) return null;

      const slug = paletteName.toLowerCase().replace(/[^a-z0-9]+/g, '-');

      const cssContent = `:root {\n  /* Web-Safe Color Palette: ${paletteName} */\n${colors.map((c, i) => `  --color-${i + 1}: ${c.hex}; /* ${c.name} - ${c.usage} */`).join('\n')}\n}`;
      const tailwindContent = `// tailwind.config.js\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n        '${slug}': {\n${colors.map((c, i) => `          ${(i + 1) * 100}: '${c.hex}', // ${c.name}`).join('\n')}\n        }\n      }\n    }\n  }\n};`;
      const jsonContent = JSON.stringify({ paletteName, generatedAt: new Date().toISOString(), totalColors: colors.length, colors: colors.map((c, i) => ({ token: `color-${i + 1}`, hex: c.hex, name: c.name, role: c.usage, isWebSafe: c.isWebSafe, webSafeHex: c.webSafeHex, contrastWhite: c.contrastWhite, contrastBlack: c.contrastBlack, accessibility: c.accessibility })) }, null, 2);
      const swatchW = 120, swatchH = 160, totalSvgW = colors.length * swatchW;
      const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalSvgW} ${swatchH}" width="${totalSvgW}" height="${swatchH}">\n  <style>.label { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 13px; font-weight: bold; } .sub { font-family: 'Inter', sans-serif; font-size: 11px; fill: #64748b; }</style>\n${colors.map((c, i) => `  <g transform="translate(${i * swatchW}, 0)">\n    <rect width="${swatchW}" height="100" fill="${c.hex}" />\n    <rect y="100" width="${swatchW}" height="60" fill="#ffffff" stroke="#e2e8f0" />\n    <text x="12" y="125" class="label" fill="#0f172a">${c.hex}</text>\n    <text x="12" y="145" class="sub">${c.name.slice(0, 14)}</text>\n  </g>`).join('\n')}\n</svg>`;
      const swatchHtml = `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>${paletteName} - Web-Safe Color Palette</title>\n  <script src="https://cdn.tailwindcss.com"><\/script>\n  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">\n  <style>body{font-family:'Inter',sans-serif;}h1{font-family:'Plus Jakarta Sans','Inter',sans-serif;}</style>\n</head>\n<body class="bg-[#F8FAFC] text-slate-900 p-6 md:p-12 min-h-screen">\n  <div class="max-w-5xl mx-auto space-y-8">\n    <h1 class="text-3xl font-extrabold text-slate-900">${paletteName}</h1>\n    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-${Math.min(colors.length, 5)} gap-4">\n${colors.map((c, i) => `      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">\n        <div class="h-32 p-3.5 flex flex-col justify-between" style="background-color:${c.hex};color:${c.contrastWhite >= 4.5 ? '#ffffff' : '#000000'}">\n          <span class="text-xs font-mono font-bold">#${String(i + 1).padStart(2, '0')}</span>\n          <span class="text-2xl font-bold font-mono">${c.hex}</span>\n        </div>\n        <div class="p-3.5 text-xs"><p class="font-bold">${c.name}</p><p class="text-slate-500">${c.usage}</p></div>\n      </div>`).join('\n')}\n    </div>\n  </div>\n</body>\n</html>`;

      const getCode = () => {
        if (tab === 'css') return cssContent;
        if (tab === 'tailwind') return tailwindContent;
        if (tab === 'json') return jsonContent;
        if (tab === 'svg') return svgContent;
        return swatchHtml;
      };

      const handleDownload = () => {
        const code = getCode();
        const ext = tab === 'tailwind' ? 'js' : tab === 'html' ? 'html' : tab;
        const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${slug}.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleCopy = () => {
        navigator.clipboard.writeText(getCode());
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return h('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm' }, [
        h('div', { className: 'bg-white rounded-2xl max-w-2xl w-full border border-slate-200 shadow-xl overflow-hidden' }, [
          h('div', { className: 'px-6 py-4 border-b border-slate-100 flex items-center justify-between' }, [
            h('div', null, [
              h('h3', { className: 'text-base font-bold text-slate-900' }, 'Export Palette'),
              h('p', { className: 'text-xs text-slate-500' }, `Export ${paletteName} (${colors.length} colors) as CSS, Tailwind, JSON, SVG, or HTML`)
            ]),
            h('button', { type: 'button', onClick: onClose, className: 'psq-btn p-1.5 rounded-lg shrink-0', 'aria-label': 'Close export dialog' }, h(XIcon, { className: 'w-4 h-4' }))
          ]),
          h('div', { className: 'px-6 pt-4 flex items-center gap-1.5 border-b border-slate-100 pb-3 overflow-x-auto' },
            [['css', 'CSS Variables'], ['tailwind', 'Tailwind'], ['json', 'JSON Tokens'], ['svg', 'SVG Strip'], ['html', 'Palette HTML']].map(([id, label]) =>
              h('button', {
                key: id,
                type: 'button',
                'data-segmented': 'true',
                'data-active': tab === id ? 'true' : undefined,
                onClick: () => setTab(id),
                className: 'psq-btn px-3 py-1.5 rounded-lg text-xs font-semibold uppercase tracking-wider whitespace-nowrap shrink-0'
              }, label)
            )
          ),
          h('div', { className: 'p-6 space-y-4' }, [
            h('pre', { className: 'p-4 bg-slate-900 text-slate-100 rounded-xl text-xs font-mono overflow-x-auto max-h-72 leading-relaxed selection:bg-[#71B94D] selection:text-white' }, h('code', null, getCode())),
            h('div', { className: 'flex justify-end gap-2' }, [
              h('button', {
                type: 'button',
                onClick: handleDownload,
                className: 'psq-btn inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold rounded-lg whitespace-nowrap'
              }, [h(DownloadIcon, { className: 'w-3.5 h-3.5' }), h('span', null, `Download .${tab === 'tailwind' ? 'js' : tab}`)]),
              h('button', {
                type: 'button',
                onClick: handleCopy,
                className: 'psq-btn inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold rounded-lg shadow-sm whitespace-nowrap'
              }, [copied ? h(CheckIcon, { className: 'w-3.5 h-3.5' }) : h(CopyIcon, { className: 'w-3.5 h-3.5' }), h('span', null, copied ? 'Copied to Clipboard!' : 'Copy Code')])
            ])
          ])
        ])
      ]);
    }

    /* ==========================================================================
       MAIN ROOT APP COMPONENT
       ========================================================================== */
    const MAX_STARTING_COLORS = 6;

    function App() {
      const [count, setCount] = useState(5);
      const [style, setStyle] = useState('Vibrant Modern');
      const [seedColors, setSeedColors] = useState(['#71B94D', '#10A3FF', '#FFB82A', '#FC57E5']);
      const [strictWebSafe, setStrictWebSafe] = useState(true);
      const [palette, setPalette] = useState(() => generateHarmonicPalette(5, 'Vibrant Modern', ['#71B94D', '#10A3FF', '#FFB82A', '#FC57E5'], true));
      const [isExportOpen, setIsExportOpen] = useState(false);

      // Starting Color inputs (HEX, RGB, CMYK)
      const [inputFormat, setInputFormat] = useState('hex');
      const [colorPickerVal, setColorPickerVal] = useState('#71B94D');
      const [hexInput, setHexInput] = useState('');
      const [rgbInput, setRgbInput] = useState({ r: '113', g: '185', b: '77' });
      const [cmykInput, setCmykInput] = useState({ c: '39', m: '0', y: '58', k: '27' });
      const [inputError, setInputError] = useState('');

      // Image upload & sampling state
      const [uploadedImage, setUploadedImage] = useState(null);
      const [extractingImage, setExtractingImage] = useState(false);
      const [imageError, setImageError] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [sampledHex, setSampledHex] = useState(null);
      const fileInputRef = useRef(null);

      // Contrast matrix indices
      const [fgIndex, setFgIndex] = useState(0);
      const [bgIndex, setBgIndex] = useState(1);

      const paletteRef = useRef(palette);
      paletteRef.current = palette;
      const hasMountedRef = useRef(false);
      const skipNextAutoGenerateRef = useRef(false);

      const syncAllInputsFromHex = (hex, updateHexText = true) => {
        const clean = normalizeHex(hex);
        if (!isValidHex(clean)) return;
        const { r, g, b } = hexToRgb(clean);
        const { c, m, y, k } = rgbToCmyk(r, g, b);
        setColorPickerVal(clean);
        if (updateHexText) setHexInput(clean);
        setRgbInput({ r: String(r), g: String(g), b: String(b) });
        setCmykInput({ c: String(c), m: String(m), y: String(y), k: String(k) });
      };

      const resolveCurrentInputHex = () => {
        if (inputFormat === 'rgb') {
          const r = Number(rgbInput.r), g = Number(rgbInput.g), b = Number(rgbInput.b);
          if (
            rgbInput.r.trim() === '' || rgbInput.g.trim() === '' || rgbInput.b.trim() === '' ||
            Number.isNaN(r) || Number.isNaN(g) || Number.isNaN(b) ||
            r < 0 || r > 255 || g < 0 || g > 255 || b < 0 || b > 255
          ) {
            return { hex: null, error: 'Enter RGB channel values between 0 and 255' };
          }
          return { hex: rgbToHex(r, g, b) };
        }
        if (inputFormat === 'cmyk') {
          const c = Number(cmykInput.c), m = Number(cmykInput.m), y = Number(cmykInput.y), k = Number(cmykInput.k);
          if (
            cmykInput.c.trim() === '' || cmykInput.m.trim() === '' || cmykInput.y.trim() === '' || cmykInput.k.trim() === '' ||
            Number.isNaN(c) || Number.isNaN(m) || Number.isNaN(y) || Number.isNaN(k) ||
            c < 0 || c > 100 || m < 0 || m > 100 || y < 0 || y > 100 || k < 0 || k > 100
          ) {
            return { hex: null, error: 'Enter CMYK percentages between 0 and 100' };
          }
          return { hex: cmykToHex(c, m, y, k) };
        }
        const raw = (hexInput || colorPickerVal).trim();
        const parsed = parseFlexibleColorInput(raw);
        if (!parsed) {
          return { hex: null, error: 'Enter a valid HEX (#71B94D), RGB, or CMYK value' };
        }
        return { hex: parsed };
      };

      const handleRgbFieldChange = (channel, val) => {
        const next = { ...rgbInput, [channel]: val };
        setRgbInput(next);
        setInputError('');
        const r = Number(next.r), g = Number(next.g), b = Number(next.b);
        if (
          next.r !== '' && next.g !== '' && next.b !== '' &&
          !Number.isNaN(r) && !Number.isNaN(g) && !Number.isNaN(b) &&
          r >= 0 && r <= 255 && g >= 0 && g <= 255 && b >= 0 && b <= 255
        ) {
          const hex = rgbToHex(r, g, b);
          setColorPickerVal(hex);
          setHexInput(hex);
          const { c, m, y, k } = rgbToCmyk(r, g, b);
          setCmykInput({ c: String(c), m: String(m), y: String(y), k: String(k) });
        }
      };

      const handleCmykFieldChange = (channel, val) => {
        const next = { ...cmykInput, [channel]: val };
        setCmykInput(next);
        setInputError('');
        const c = Number(next.c), m = Number(next.m), y = Number(next.y), k = Number(next.k);
        if (
          next.c !== '' && next.m !== '' && next.y !== '' && next.k !== '' &&
          !Number.isNaN(c) && !Number.isNaN(m) && !Number.isNaN(y) && !Number.isNaN(k) &&
          c >= 0 && c <= 100 && m >= 0 && m <= 100 && y >= 0 && y <= 100 && k >= 0 && k <= 100
        ) {
          const hex = cmykToHex(c, m, y, k);
          setColorPickerVal(hex);
          setHexInput(hex);
          const { r, g, b } = hexToRgb(hex);
          setRgbInput({ r: String(r), g: String(g), b: String(b) });
        }
      };

      const handleGenerate = useCallback((overrideSeeds, overrideCount) => {
        const seedsToUse = Array.isArray(overrideSeeds) ? overrideSeeds : seedColors;
        const countToUse = typeof overrideCount === 'number' ? overrideCount : count;
        const current = paletteRef.current;
        const locked = current ? current.colors : [];
        const next = generateHarmonicPalette(countToUse, style, seedsToUse, strictWebSafe, locked);
        setPalette(next);
      }, [count, style, seedColors, strictWebSafe]);

      const handleGenerateRef = useRef(handleGenerate);
      handleGenerateRef.current = handleGenerate;

      // Auto-generate when palette size, color harmony theory, strict 216 web-safe matrix, or starting colors change
      useEffect(() => {
        if (!hasMountedRef.current) {
          hasMountedRef.current = true;
          return;
        }
        if (skipNextAutoGenerateRef.current) {
          skipNextAutoGenerateRef.current = false;
          return;
        }
        const timer = window.setTimeout(() => {
          handleGenerateRef.current();
        }, 80);
        return () => window.clearTimeout(timer);
      }, [count, style, strictWebSafe, seedColors]);

      // Persist clicked state (#73716D with white text) on action buttons once clicked
      useEffect(() => {
        const handleDocClick = (event) => {
          const target = event.target;
          const btn = target && target.closest ? target.closest('button.psq-btn:not([data-segmented="true"])') : null;
          if (btn && !btn.disabled) {
            btn.setAttribute('data-clicked', 'true');
          }
        };
        document.addEventListener('click', handleDocClick);
        return () => document.removeEventListener('click', handleDocClick);
      }, []);

      // Auto-adjust count if starting colors exceed count, capped at 10
      useEffect(() => {
        if (seedColors.length > count) {
          setCount(Math.min(10, seedColors.length));
        }
      }, [seedColors.length, count]);

      const handleAddColor = (hexToAdd) => {
        if (seedColors.length >= MAX_STARTING_COLORS) {
          setInputError(`Maximum ${MAX_STARTING_COLORS} starting colors allowed`);
          return;
        }
        let resolvedHex = null;
        if (hexToAdd) {
          resolvedHex = parseFlexibleColorInput(hexToAdd);
        } else {
          const res = resolveCurrentInputHex();
          if (!res.hex) {
            setInputError(res.error || 'Enter a valid color value');
            return;
          }
          resolvedHex = res.hex;
        }
        if (!resolvedHex || !isValidHex(resolvedHex)) {
          setInputError('Enter a valid color value');
          return;
        }
        const cleanHex = normalizeHex(resolvedHex);
        if (seedColors.includes(cleanHex)) {
          setInputError('Color already in starting colors');
          return;
        }
        const nextColors = [...seedColors, cleanHex].slice(0, MAX_STARTING_COLORS);
        setSeedColors(nextColors);
        if (nextColors.length > count) setCount(Math.min(10, nextColors.length));
        if (inputFormat === 'hex') setHexInput('');
        setInputError('');
      };

      const handleRemoveColor = (color) => {
        setSeedColors(seedColors.filter(c => c !== color));
      };

      const handleGenerateFromImage = useCallback((imageResult, mode = 'direct') => {
        const topSeeds = imageResult.colors.slice(0, MAX_STARTING_COLORS);
        const nextCount = Math.max(count, Math.min(10, topSeeds.length));
        if (topSeeds.length > 0) {
          skipNextAutoGenerateRef.current = true;
          setSeedColors(topSeeds);
          if (nextCount !== count) {
            setCount(nextCount);
          }
        }
        const current = paletteRef.current;
        const locked = current ? current.colors : [];
        if (mode === 'seeds') {
          setPalette(generateHarmonicPalette(nextCount, style, topSeeds, strictWebSafe, locked));
        } else {
          setPalette(generatePaletteFromImageResult(imageResult, nextCount, style, strictWebSafe, locked));
        }
      }, [count, style, strictWebSafe]);

      const handleProcessImageFile = async (file) => {
        setExtractingImage(true);
        setImageError('');
        setSampledHex(null);
        try {
          const result = await extractColorsFromImageFile(file, 10);
          setUploadedImage(result);
          handleGenerateFromImage(result, 'direct');
        } catch (err) {
          setImageError((err && err.message) || 'Unable to process image file.');
        } finally {
          setExtractingImage(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      const handleToggleExtractedSwatch = (hex) => {
        setInputError('');
        if (seedColors.includes(hex)) {
          setSeedColors(seedColors.filter(c => c !== hex));
          return;
        }
        if (seedColors.length < MAX_STARTING_COLORS) {
          const next = [...seedColors, hex];
          setSeedColors(next);
          if (next.length > count) setCount(Math.min(10, next.length));
        } else {
          setSeedColors([...seedColors.slice(0, MAX_STARTING_COLORS - 1), hex]);
        }
      };

      const handleImageEyedropperClick = (e) => {
        const sampled = sampleColorFromImageClick(e.currentTarget, e.clientX, e.clientY);
        if (!sampled) return;
        setSampledHex(sampled);
        setInputError('');
        if (!seedColors.includes(sampled)) {
          if (seedColors.length < MAX_STARTING_COLORS) {
            const next = [...seedColors, sampled];
            setSeedColors(next);
            if (next.length > count) setCount(Math.min(10, next.length));
          } else {

                        'data-active': count === num ? 'true' : undefined,
                        onClick: () => setCount(Math.max(minCount, num)),
                        className: 'psq-btn flex-1 py-1.5 text-xs font-semibold rounded-md shadow-sm'
                      }, num)
                    )
                  ),
                  h('div', { className: 'flex items-center gap-3 pt-1' }, [
                    h('span', { className: 'text-[11px] text-slate-400 font-mono' }, minCount),
                    h('input', {
                      type: 'range',
                      min: minCount,
                      max: 10,
                      value: count,
                      onChange: (e) => setCount(parseInt(e.target.value, 10)),
                      className: 'w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-[#71B94D]'
                    }),
                    h('span', { className: 'text-[11px] text-slate-400 font-mono' }, '10')
                  ])
                ]),

                h('div', { className: 'space-y-2' }, [
                  h('label', { className: 'text-xs font-bold uppercase tracking-wider text-slate-700' }, 'Color Harmony Theory'),
                  h('div', { className: 'relative' }, [
                    h('select', {
                      value: style,
                      onChange: (e) => setStyle(e.target.value),
                      className: 'w-full appearance-none bg-slate-50 border border-slate-200 text-slate-800 text-xs py-2.5 px-3.5 pr-8 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#71B94D] font-medium'
                    }, HARMONY_THEORIES.map(t => h('option', { key: t.id, value: t.id }, t.name))),
                    h('div', { className: 'pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-400' }, '▼')
                  ]),
                  h('p', { className: 'text-[11px] text-slate-500 font-medium' },
                    HARMONY_THEORIES.find(t => t.id === style)?.desc || 'Determines algorithmic relationships between generated tones.'
                  )
                ]),

                h('div', { className: 'space-y-2' }, [
                  h('span', { className: 'block text-xs font-bold uppercase tracking-wider text-slate-700' }, 'Web-Safe Enforcement'),
                  h('label', {
                    className: `flex items-start gap-3 p-3 rounded-lg border cursor-pointer select-none transition-colors ${strictWebSafe ? 'bg-[#71B94D]/10 border-[#71B94D]/40' : 'bg-slate-50 border-slate-200 hover:bg-slate-100/70'}`
                  }, [
                    h('input', {
                      type: 'checkbox',
                      checked: strictWebSafe,
                      onChange: (e) => setStrictWebSafe(e.target.checked),
                      className: 'mt-0.5 w-4 h-4 rounded accent-[#71B94D] focus:ring-[#71B94D] border-slate-300 shrink-0'
                    }),
                    h('div', { className: 'min-w-0' }, [
                      h('span', { className: 'text-xs font-semibold text-slate-800 flex items-center gap-1.5' }, [
                        h(ShieldCheckIcon, { className: 'w-3.5 h-3.5 text-[#71B94D] shrink-0' }),
                        h('span', null, 'Strict 216 Web-Safe Matrix')
                      ]),
                      h('p', { className: 'text-[11px] text-slate-500 mt-0.5 leading-snug' },
                        'Snaps all generated hex codes to standard 00, 33, 66, 99, CC, FF stops.'
                      )
                    ])
                  ])
                ])
              ])
            ])
          ]),

          // Palette Display Section
          palette && h('div', { className: 'space-y-6' }, [
            h('div', { className: 'flex flex-col md:flex-row md:items-end justify-between pb-4 border-b border-slate-200 gap-4' }, [
              h('div', null, [
                h('h2', { className: 'text-2xl font-bold text-slate-900' }, palette.paletteName),
                h('p', { className: 'text-xs text-slate-600 mt-1' }, palette.description),
                h('div', { className: 'flex flex-wrap items-center gap-2 text-xs text-slate-500 mt-2 font-mono' }, [
                  h('span', null, `${palette.colors.length} Colors`),
                  h('span', null, '·'),
                  h('span', null, style),
                  h('span', null, '·'),
                  h('span', null, `${seedColors.length} Starting Colors`),
                  h('span', null, '·'),
                  h('span', null, `${palette.colors.filter(c => c.isWebSafe).length}/${palette.colors.length} Web-Safe`)
                ])
              ]),
              h('div', { className: 'flex items-center gap-2 flex-wrap' }, [
                palette.colors.some(c => c.isLocked) && h('button', {
                  type: 'button',
                  onClick: handleUnlockAll,
                  className: 'psq-btn inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap'
                }, `Unlock All (${palette.colors.filter(c => c.isLocked).length})`),
                h('button', {
                  type: 'button',
                  onClick: handleSnapAllToWebSafe,
                  className: 'psq-btn inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap'
                }, [h(ShieldCheckIcon, { className: 'w-3.5 h-3.5 text-white' }), h('span', null, 'Snap All to 216 Safe')]),
                h('button', {
                  type: 'button',
                  onClick: () => handleGenerate(),
                  className: 'psq-btn inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg whitespace-nowrap'
                }, [h(RefreshIcon, { className: 'w-3.5 h-3.5' }), h('span', null, 'Shuffle')])
              ])
            ]),

            // Color Cards Grid
            h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4' },
              palette.colors.map((color, index) => h(ColorCard, {
                key: `color-slot-${index}`,
                color,
                index,
                onToggleLock: handleToggleLock,
                onSnapToWebSafe: handleSnapToWebSafe,
                onUpdateColor: handleUpdateColor,
                onSelectForContrast: (idx) => {
                  setFgIndex(idx);
                  document.getElementById('cross-contrast')?.scrollIntoView({ behavior: 'smooth' });
                }
              }))
            ),

            // Cross-Color Contrast Matrix
            h(ContrastMatrix, {
              colors: palette.colors,
              fgIndex,
              setFgIndex,
              bgIndex,
              setBgIndex,
              onUpdateColor: handleUpdateColor
            })
          ]),

          // Educational Reference Section
          h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6 mt-16' }, [
            h('section', { id: 'wcag-guide', className: 'bg-white rounded-2xl border border-slate-200/80 p-6 md:p-8 shadow-sm' }, [
              h('span', { className: 'text-xs font-bold uppercase tracking-wider text-slate-400' }, 'Accessibility Standards'),
              h('h3', { className: 'text-lg font-bold text-slate-900 mt-1' }, 'WCAG 2.1 Contrast Requirements'),
              h('p', { className: 'text-xs text-slate-600 mt-2 leading-relaxed' },
                'Every color in your palette is checked in real time against both pure white (#FFFFFF) and pure black (#000000).'
              ),
              h('div', { className: 'grid grid-cols-2 gap-3 mt-4 text-xs' }, [
                h('div', { className: 'p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1' }, [
                  h('span', { className: 'font-bold text-slate-800' }, 'Level AA (Standard)'),
                  h('p', { className: 'text-[11px] text-slate-500 leading-normal' }, ['Small text (<18pt): ≥ 4.5:1', h('br'), 'Large text (≥18pt): ≥ 3.0:1'])
                ]),
                h('div', { className: 'p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1' }, [
                  h('span', { className: 'font-bold text-slate-800' }, 'Level AAA (Enhanced)'),
                  h('p', { className: 'text-[11px] text-slate-500 leading-normal' }, ['Small text (<18pt): ≥ 7.0:1', h('br'), 'Large text (≥18pt): ≥ 4.5:1'])
                ])
              ])
            ]),
            h('section', { id: 'web-safe-guide', className: 'bg-white rounded-2xl border border-slate-200/80 p-6 md:p-8 shadow-sm' }, [
              h('span', { className: 'text-xs font-bold uppercase tracking-wider text-slate-400' }, 'Color Space Matrix'),
              h('h3', { className: 'text-lg font-bold text-slate-900 mt-1' }, 'The 216 Web-Safe Matrix'),
              h('p', { className: 'text-xs text-slate-600 mt-2 leading-relaxed' },
                'Web-safe colors ensure identical color reproduction across any digital display or browser without dithering. The palette is formed by 6 stepped intensities per RGB channel:'
              ),
              h('div', { className: 'flex flex-wrap items-center gap-1.5 mt-4' },
                ['00 (0)', '33 (51)', '66 (102)', '99 (153)', 'CC (204)', 'FF (255)'].map(step =>
                  h('span', { key: step, className: 'px-2.5 py-1 bg-slate-100 text-slate-800 font-mono text-xs rounded-md font-semibold' }, step)
                )
              ),
              h('p', { className: 'text-[11px] text-slate-400 mt-3 font-mono' }, '6 × 6 × 6 = 216 universal, predictable coordinates.')
            ])
          ])
        ]),

        /* ================= 3. FOOTER ================= */
        h('footer', { className: 'border-t border-slate-200 bg-white py-8 mt-16 text-center text-xs text-slate-500' }, [
          h('div', { className: 'max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4' }, [
            h('div', { className: 'flex items-center gap-3' }, [
              h(ParentSquareLogo, { className: 'h-5 w-auto object-contain opacity-75' }),
              h('span', { className: 'h-3.5 w-px bg-slate-300' }),
              h('span', { className: 'font-bold text-slate-700' }, 'Palette Studio'),
              h('span', null, '· Universal Web-Safe & WCAG Color System')
            ]),
            h('p', { className: 'text-slate-400' }, 'Accessible Digital Design Tokens')
          ])
        ]),

        /* ================= 4. EXPORT MODAL ================= */
        palette && h(ExportModal, {
          isOpen: isExportOpen,
          onClose: () => setIsExportOpen(false),
          paletteName: palette.paletteName,
          colors: palette.colors
        })
      ]);
    }

    (function mountApp() {
      const rootEl = document.getElementById('root');
      if (!rootEl) return;
      try {
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
          throw new Error('React libraries failed to load from CDN. Check network access and reload.');
        }
        ReactDOM.createRoot(rootEl).render(React.createElement(App));
      } catch (err) {
        rootEl.innerHTML = '<div style="max-width:600px;margin:48px auto;padding:24px;background:#fff;border:1px solid #fecdd3;border-radius:12px;font-family:sans-serif;color:#be123c;"><h2 style="margin:0 0 8px 0;font-size:16px;">Unable to initialize Web-Safe Color Palette Studio</h2><p style="margin:0;font-size:13px;color:#475569;">' + String(err && err.message || err) + '</p></div>';
      }
    })();
  </script>
</body>
</html>
